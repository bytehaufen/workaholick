[package]
name = "workaholick"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Track work, break, and daily activity from the terminal"
license = "MIT"
repository = "https://github.com/bytehaufen/workaholick"
readme = "README.md"

[features]
default = ["markdown"]
markdown = ["dep:termimad"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
clap-cargo = "0.18.3"
clap_complete = "4.5.53"
colored = "3.1.1"
confy = "2.0.0"
directories = "6.0.0"
indexmap = "2.13.0"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
strum = { version = "0.27.2", features = ["derive"] }
tempfile = "3.24.0"
termimad = { version = "0.34.1", optional = true }
thiserror = "2.0.17"
toml = "0.9.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
