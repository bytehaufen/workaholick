[package]
name = "workaholick"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Track work, break, and daily activity from the terminal"
license = "MIT"
repository = "https://github.com/bytehaufen/workaholick"
readme = "README.md"

[features]
default = ["markdown"]
markdown = ["dep:termimad"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap-cargo = "0.19.0"
clap_complete = "4.6.11"
colored = "3.1.1"
confy = "2.0.0"
directories = "6.0.0"
indexmap = "2.14.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
termimad = { version = "0.35.5", optional = true }
thiserror = "2.0.21"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_results = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
